[build]
  base = "ApplyJobs"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"

[dev]
  framework = "#custom"
  command = "npm --prefix ApplyJobs run dev -- --host 127.0.0.1"
  targetPort = 5173
  port = 8888
  autoLaunch = false

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
